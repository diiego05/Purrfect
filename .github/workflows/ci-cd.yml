name: Purrfect CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feat/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Chặng 1: Lint & Code Quality
  lint:
    name: "1. Lint & Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Lint Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run lint
      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

  # Chặng 2: Automated Testing
  test:
    name: "2. Automated Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Backend
        working-directory: ./backend
        run: |
          npm ci
          npm test --if-present
      - name: Test Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm test --if-present

  # Chặng 3: Security & Dependency Scan
  security-audit:
    name: "3. Security & Dependency Scan"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit Backend Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=critical || true
      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=critical || true

  # Chặng 4: Build & Compile Artifacts
  build:
    name: "4. Build & Compile Artifacts"
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Backend (TypeScript)
        working-directory: ./backend
        run: |
          npm ci
          npm run build
      - name: Build Frontend (Vite)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # Chặng 5: Docker Container Packaging
  docker-packaging:
    name: "5. Docker Container Packaging"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: purrfect-backend:latest

  # Chặng 6: Continuous Deployment (CD)
  deploy:
    name: "6. Continuous Deployment (CD)"
    runs-on: ubuntu-latest
    needs: [build, docker-packaging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Trigger Deploy Backend lên Render
      - name: Trigger Backend Deployment on Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo " Đang kích hoạt Render Deploy Hook..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo " Kích hoạt Render thành công!"
          else
            echo "RENDER_DEPLOY_HOOK_URL chưa được cấu hình trong Secrets. Bỏ qua trigger tự động."
          fi

      # Trigger Deploy Frontend lên Vercel
      - name: Trigger Frontend Deployment on Vercel
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "Đang kích hoạt Vercel Deploy Hook..."
            curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
            echo " Kích hoạt Vercel thành công!"
          else
            echo "Vercel tự động triển khai qua GitHub integration khi merge vào main."
          fi

  # Chặng 7: Post-Deployment Health Check
  health-check:
    name: "7. Post-Deployment Health Check"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Health Check Production Endpoint
        run: |
          if [ -n "${{ secrets.PRODUCTION_API_URL }}" ]; then
            echo "🩺 Đang kiểm tra sức khỏe hệ thống: ${{ secrets.PRODUCTION_API_URL }}/health..."
            curl -s -f "${{ secrets.PRODUCTION_API_URL }}/health" || echo "⚠️ Backend đang trong quá trình khởi động..."
          else
            echo "PRODUCTION_API_URL chưa cấu hình. Bỏ qua ping kiểm tra."
          fi
